name: Build, test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: servernavigator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install pinned Maven 3.9.11
        shell: bash
        run: |
          curl -fsSLO https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz
          curl -fsSLO https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz.sha512
          printf '%s  %s\n' "$(cat apache-maven-3.9.11-bin.tar.gz.sha512)" apache-maven-3.9.11-bin.tar.gz | sha512sum --check
          tar -xzf apache-maven-3.9.11-bin.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
      - name: Compile and run tests
        run: mvn -B -ntp clean verify
      - name: Prepare verified release files
        shell: bash
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as e; print(e.parse("pom.xml").findtext("{http://maven.apache.org/POM/4.0.0}version"))')
          mkdir dist
          cp "target/ServerNavigator-$VERSION.jar" "target/ServerNavigator-$VERSION-sources.jar" dist/
          cp src/main/resources/config.toml dist/
          git archive --format=zip --prefix="ServerNavigator-$VERSION/" HEAD -o "dist/ServerNavigator-$VERSION-source.zip"
          zip -j "dist/ServerNavigator-$VERSION-test-reports.zip" target/surefire-reports/*.xml target/surefire-reports/*.txt
          python3 - "$GITHUB_SHA" > dist/BUILD.txt <<'PY'
          import sys, xml.etree.ElementTree as E, glob, zipfile
          roots=[E.parse(p).getroot() for p in glob.glob('target/surefire-reports/TEST-*.xml')]
          print('Commit:',sys.argv[1])
          for key in ('tests','failures','errors','skipped'):
              print(key + ':',sum(int(r.get(key,0)) for r in roots))
          version=E.parse('pom.xml').findtext('{http://maven.apache.org/POM/4.0.0}version')
          with zipfile.ZipFile('target/ServerNavigator-'+version+'.jar') as z:
              names=z.namelist()
              assert 'velocity-plugin.json' in names and 'config.toml' in names
              assert any(n.startswith('io/github/etzewetze/servernavigator/lib/tomlj/') for n in names)
              assert not any(n.startswith(('com/velocitypowered/','net/kyori/')) for n in names)
          print('Installable JAR structure verified')
          PY
          java -version >> dist/BUILD.txt 2>&1
          mvn -version >> dist/BUILD.txt 2>&1
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: servernavigator-release
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: servernavigator-release
          path: dist
      - name: Publish new tested version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as e; print(e.parse("pom.xml").findtext("{http://maven.apache.org/POM/4.0.0}version"))')
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving its tag and files unchanged."
            exit 0
          fi
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ServerNavigator $VERSION" --notes-file "docs/RELEASE-$VERSION.md"
