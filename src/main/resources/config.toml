# ServerNavigator 1.1.0 – Velocity 4.3.x / Java 25.
# Unabhängiges Plugin: kein bestimmter Hoster, kein bestimmtes Panel erforderlich.
# Die Datei liegt im Proxy unter plugins/servernavigator/config.toml.
# /servernavigator reload validiert alle Einstellungen, bevor sie aktiv werden.
# Eine Datei im alten Format wird mit Sicherung auf Format 2 und das kompakte Layout umgestellt.
config-version = 2

[settings]
# Normale Proxy-Permissions, z.B. über LuckPerms. Jeder Server kann dies überschreiben.
require-server-permissions = false
# Ein gemeinsamer Befehlscooldown je Spieler über alle Ziele und Aliase.
cooldown-seconds = 15
# STANDARD-WARTEZEIT: Countdown-Schätzung für alle Server ohne eigenen Wert.
# Kein künstliches Zurückhalten: erfolgreiche Verbindung immer sofort, auch vor Ablauf!
expected-startup-seconds = 30
# Tatsächliche maximale Wartefrist je Wunsch; unabhängig von der Countdown-Schätzung.
max-wait-seconds = 180
# Nur prüfen, wenn Spieler warten. Es werden echte asynchrone Logins statt Pings verwendet.
poll-interval-ms = 2000
# Plugin-Frist je Netzwerk-/Startversuch; HTTP setzt außerdem echte Netzwerk-Timeouts.
# Velocity-Login-Timeouts zusätzlich in velocity.toml einstellen (siehe README).
attempt-timeout-ms = 10000
# Alle tatsächlichen Login-/Trigger-Versuche je Wunsch, einschließlich Erstversuch.
max-connection-attempts = 100
# Erlaubte aufeinanderfolgende Netzwerkfehler, auch wenn kein Startdienst antwortet.
# 0 beendet schon beim ersten Netzwerkfehler. Ein Fehler beweist keinen Schlafzustand.
# Zusätzlich gelten max-connection-attempts und max-wait-seconds.
network-retries = 100
# Optionale erkannte Startantworten. Unbekannte echte Login-Ablehnungen sind terminal.
# Regex, case-insensitive. Dies ist eine allgemeine Meldungsklassifikation, keine Panel-API.
starting-patterns = [
  'server (?:is (?:currently )?)?(?:sleeping|starting|waking(?: up)?)',
  'server is being started',
  'server (?:wird (?:gerade )?gestartet|startet(?: gerade)?|schläft|wird aufgeweckt)',
  'waking (?:up )?(?:the )?server'
]
# Diese Gründe haben immer Vorrang vor starting-patterns und werden nicht wiederholt.
terminal-patterns = [
  'whitelist|white-listed|not whitelisted|nicht (?:auf|in) der whitelist',
  'server is full|server (?:ist )?voll|maximum number of players',
  'maintenance|wartung|banned|gebannt|outdated|veraltet|incompatible|inkompatibel',
  'forwarding|authenticate|authentication|verify username|invalid session'
]

[display]
# Gewünschte Standardansicht: TITLE oder BOSSBAR. Beide schicken die einmalige Chatnachricht.
# Weiterhin kombinierbar: TITLE, BOSSBAR, ACTIONBAR, CHAT. NONE ausschließlich allein.
# CHAT ist zusätzlicher wiederholter Status; für die einmalige Erklärung nicht erforderlich.
modes = ["TITLE"]
update-interval-ms = 500
chat-interval-seconds = 10
# Die folgende Nachricht kommt genau einmal pro neu angenommenem Wunsch, unabhängig von modes.
# Cooldown-Wiederholungen und Anzeige-Updates schicken sie nicht erneut.
wait-chat-enabled = true
wait-chat = '<gray>Sobald der Server antwortet, wirst du teleportiert.</gray>'
# Alle Texte sind MiniMessage. Platzhalter: <server>/<servername>, <seconds>/<zeit>,
# <elapsed>, <cooldown>, <status>, <reason>, <count>, <waiters>, <attempts>.
# TITLE besteht aus zwei echten Vanilla-Zeilen: title groß, subtitle kleiner darunter.
title = '<server> <gold>Startet</gold>'
subtitle = '<gray>~<seconds> Sekunden</gray>'
# Alternativ ein Umbruch in title: '<server> Startet<newline/>~<zeit> Sekunden'
# Die zweite Zeile ersetzt dann subtitle. Höchstens zwei Titelzeilen möglich.
# Unterstützt: <newline>, <newline/>, <br>, echtes LF und literales \n.
# Im Chat sind mehrere Zeilen möglich; Bossbar/Actionbar bleiben technisch einzeilig
# und verbinden Umbrüche mit einem Leerzeichen. Keine frei skalierbare Vanilla-Schrift.
bossbar = '<server> startet <gray>| ~<seconds> s</gray>'
actionbar = '<server> startet <gray>| ~<seconds> s</gray>'
chat = '<server> <gray>| <status> | voraussichtlich noch <seconds> Sekunden</gray>'
# Nach Ende der Schätzung kein negativer Countdown und keine automatische Freigabe.
title-longer = '<server> <gold>Startet</gold>'
subtitle-longer = '<yellow>Start dauert länger …</yellow>'
bossbar-longer = '<server> <yellow>| Start dauert länger …</yellow>'
actionbar-longer = '<server> <yellow>| Start dauert länger …</yellow>'
chat-longer = '<server> <yellow>| Start dauert länger …</yellow>'
# Status wird nur eingefügt, wenn eine eigene Vorlage <status> verwendet.
status-checking = 'Warte auf Antwort …'
status-starting = 'startet'
status-longer = 'Start dauert länger …'
status-connecting = 'Verbindung wird hergestellt …'
# Bossbar-Farbe separat vom Text: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE.
bossbar-color = "PURPLE"
# PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20.
bossbar-overlay = "PROGRESS"
# Title-Zeiten in Millisekunden; kurze fade-in verhindert Flackern bei Timer-Updates.
title-fade-in-ms = 0
title-stay-ms = 1100
title-fade-out-ms = 200
# Normale Textdarstellung ohne Resourcepack. Eigene Fonts/Glyphen später über <font:...>.

[messages]
# Einzelne Befehlsantworten/Fehler; die einmalige Warteerklärung steht unter display.wait-chat.
no-permission = "<red>Du hast dafür keine Berechtigung.</red>"
player-only = "<red>Dieser Befehl kann nur von einem Spieler verwendet werden.</red>"
unknown-server = "<red>Dieser Zielserver ist nicht konfiguriert oder nicht registriert.</red>"
already-there = "<yellow>Du bist bereits auf <server>.</yellow>"
no-current-server = "<red>Du musst bereits auf einem Spielserver sein, um hier zu warten.</red>"
cooldown = "<yellow>Bitte warte noch <cooldown> Sekunden.</yellow>"
cooldown-pending = "<yellow>Bitte warte noch <cooldown> Sekunden. Deine Verbindung zu <server> ist bereits vorgemerkt.</yellow>"
already-pending = "<yellow>Deine Verbindung zu <server> ist bereits vorgemerkt.</yellow>"
cancelled = "<gray>Dein Verbindungswunsch zu <server> wurde abgebrochen.</gray>"
nothing-pending = "<gray>Du hast keinen aktiven Verbindungswunsch.</gray>"
replaced = "<gray>Dein bisheriger Verbindungswunsch zu <server> wurde ersetzt.</gray>"
timeout = "<red><server> hat die maximale Wartezeit überschritten. Bitte versuche es später erneut.</red>"
attempt-timeout = "<red>Der Verbindungs-/Startversuch zu <server> antwortet nicht rechtzeitig. Der Wunsch wurde beendet.</red>"
attempt-limit = "<red>Die maximale Anzahl an Verbindungsversuchen zu <server> wurde erreicht.</red>"
rejected = "<red><server> hat die Verbindung abgelehnt: </red><reason>"
network-error = "<red><server> antwortet nach den erlaubten Netzwerkversuchen nicht. Bitte versuche es später erneut.</red>"
start-error = "<red>Der Starttrigger für <server> ist fehlgeschlagen. </red><reason>"
connection-cancelled = "<yellow>Die Verbindung zu <server> wurde durch eine Proxy-Regel abgebrochen.</yellow>"
connection-busy = "<yellow>Ein anderer Verbindungsversuch läuft noch. Bitte versuche es später erneut.</yellow>"
connected = "<green>Du bist jetzt mit <server> verbunden.</green>"
independent-switch = "<gray>Dein alter Verbindungswunsch wurde wegen eines anderen Serverwechsels beendet.</gray>"
reload-cancelled = "<gray>Dein Verbindungswunsch wurde wegen einer Konfigurationsänderung beendet.</gray>"
reloaded = "<green>ServerNavigator: Konfiguration und Befehle wurden neu geladen.</green>"
reload-failed = "<red>Reload abgelehnt; die bisherige Konfiguration bleibt aktiv: </red><reason>"
usage = "<gray>/servernavigator cancel | /servernavigator status [server] | /servernavigator reload</gray>"
status-idle = "<server> <gray>| kein aktiver Startvorgang, keine Wartenden; Online-Status wird nicht abgefragt.</gray>"
status-active = "<server> <gray>| <status> | <elapsed> s | <count> Wartende: <waiters> | Versuche des aktuellen Spielers: <attempts></gray>"
shutting-down = "<gray>ServerNavigator wird beendet; dein Verbindungswunsch wurde entfernt.</gray>"

# Die IDs und Befehle sind frei konfigurierbar. velocity-name MUSS in Velocity registriert sein.
# Jeder zusätzliche Server erhält ohne eigenen expected-startup-seconds-Wert die Standardzeit.
[servers.lobby]
velocity-name = "lobby"
display-name = '<#a78bfa>Lobby</#a78bfa>'
command = "lobby"
aliases = ["l", "hub"]
# Keine eigene Wartezeit: settings.expected-startup-seconds gilt.
# require-permission = false
# permission = "server.lobby"

[servers.challenges]
velocity-name = "challenges"
display-name = '<#fbbf24>Challenges</#fbbf24>'
command = "challenges"
aliases = ["challenge", "ch"]
# expected-startup-seconds = 45 # optional statt Standardzeit

[servers.survival]
velocity-name = "survival"
display-name = '<#4ade80>Survival</#4ade80>'
command = "survival"
aliases = ["surv"]
expected-startup-seconds = 60 # eigene Wartezeit überschreibt den Standard
[servers.survival.display]
bossbar-color = "GREEN"
# Alle Anzeigeeinstellungen können hier einzeln überschrieben werden, z.B.:
# modes = ["BOSSBAR"]
# wait-chat = '<gray>Sobald Survival antwortet, wirst du teleportiert.</gray>'
# title = '<server> Startet'
# subtitle = '<yellow>~<zeit> s</yellow>'

[servers.creative]
velocity-name = "creative"
display-name = '<#38bdf8>Creative</#38bdf8>'
command = "creative"
aliases = ["cre"]
# Keine eigene Wartezeit: Standardzeit gilt.

[servers.testserver]
velocity-name = "testserver"
display-name = '<#fb7185>Testserver</#fb7185>'
command = "testserver"
aliases = ["test"]
# expected-startup-seconds = 20 # optional statt Standardzeit
# require-permission = true
# permission = "servernavigator.testzugang"

# Optionaler Starttrigger je Server; ohne wake-Block gilt CONNECTION.
# CONNECTION sendet einen normalen Loginversuch. Ein vorhandener externer Dienst KANN
# darauf reagieren. Ohne solchen Dienst startet das Plugin keinen Java-Prozess selbst.
# [servers.testserver.wake]
# type = "CONNECTION"

# Alternativer, vollständig implementierter HTTPS-POST-Starttrigger:
# [servers.testserver.wake]
# type = "HTTP"
# url = "https://START-SERVICE-EXAMPLE.invalid/wake/testserver" # echter Endpunkt erforderlich
# token-environment = "SERVERNAVIGATOR_WAKE_TOKEN" # optionaler Bearer-Token aus Proxy-Umgebung
# body = '{"server":"testserver"}' # wörtlicher JSON-Body, kein erfundener Panel-Endpunkt
# Nur 2xx gilt als erfolgreicher Trigger, keine Redirects und keine POST-Wiederholung.
